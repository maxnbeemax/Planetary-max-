#:schema node_modules/wrangler/config-schema.json
name = "planetary-max"
main = "src/worker.ts"
compatibility_date = "2026-03-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
ENVIRONMENT = "production"
PROTOCOL_VERSION = "DAT-JURREAUISM-v1"
PRE_TIER_INDEX = "IDX-PRETIER-001"
ISOLATE_MEMORY_LIMIT_MB = "128"

[[kv_namespaces]]
binding = "SESSION_KV"
id = "6ead4589e312473c94661e058533360f"

[[d1_databases]]
binding = "DB"
database_name = "planetary_max_root_db"
database_id = "27f854d1-6c29-4a30-aaa5-345da09b02ff"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "NODE_REGISTRY"
class_name = "NodeRegistryDO"

[[durable_objects.bindings]]
name = "BEEMAX_SECURE_REGISTRY"
class_name = "BEEMAXSecureNodeRegistryDO"

[[migrations]]
tag = "v1-node-registry"
new_sqlite_classes = ["NodeRegistryDO"]

[[migrations]]
tag = "v2-secure-registry"
new_sqlite_classes = ["BEEMAXSecureNodeRegistryDO"]

[ai]
binding = "AI"
